# This workflow does a clean install of node dependencies and runs the TypeScript
# tests directly. Compilation is only the `npm run build` script.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: 0 5 * * 0 # 5 am Sunday (weekly)

jobs:
  build:
    strategy:
      matrix:
        os:
          # macos-latest is Apple Silicon, which matches Neo's macOS addon.
          # ubuntu-latest is Linux x64 and windows-latest is Windows x64.
          - macos-latest
          - windows-latest
          - ubuntu-latest
        node-version:
          - 26
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        # package-lock.json is gitignored. setup-node caching requires a lockfile.
        package-manager-cache: false
    - run: npm install
    - run: npm test
      env:
        CI: true

  deno:
    name: Deno test (2.9.8, experimental)
    runs-on: ubuntu-latest
    # Deno is not a supported runtime yet; this job tracks compatibility without
    # failing the workflow.
    continue-on-error: true
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 26
      uses: actions/setup-node@v7
      with:
        node-version: 26
        # package-lock.json is gitignored. setup-node caching requires a lockfile.
        package-manager-cache: false
    - uses: denoland/setup-deno@v2.0.5
      with:
        deno-version: 2.9.8
    - run: npm install
    - name: Export Node executable for subprocess fixtures
      run: echo "NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"
    - run: npm run test:unit:deno
