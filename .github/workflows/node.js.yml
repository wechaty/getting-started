# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: 0 5 * * 0 # 5 am Sunday (weekly)

jobs:
  build:
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
        node-version:
          # Node 16 is EOL. 22 is the newest LTS line this Wechaty 1.x toolchain
          # (ts-node 10 and the current puppet dependencies) is verified on.
          - 22
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        # package-lock.json is gitignored. setup-node caching requires a lockfile,
        # and the v2 cache client is what made this job fail with HTTP 400.
        package-manager-cache: false
    - run: npm install
    - run: npm test
      env:
        CI: true
        WECHATY_PUPPET_SERVICE_TOKEN: ${{ secrets.WECHATY_PUPPET_SERVICE_TOKEN }}
